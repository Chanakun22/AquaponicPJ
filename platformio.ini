; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = production

[env:esp32s3-dev-module]
platform = espressif32@6.4.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags = 
	-DBOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue

lib_ldf_mode = deep+

lib_deps = 
	adafruit/DHT sensor library@^1.4.6
	paulstoffregen/OneWire@^2.3.8
	milesburton/DallasTemperature@^3.11.0
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^6.21.5
	claws/BH1750@^1.3.0
	adafruit/Adafruit NeoPixel@^1.12.0
	WebServer

[env:production]
extends = env:esp32s3-dev-module
build_flags = 
	${env:esp32s3-dev-module.build_flags}
	-DLOG_LEVEL=3   ; LOG_LEVEL_INFO
	-O2             ; Optimization Level 2
	-DNDEBUG        ; Disable standard assertions
board_build.f_cpu = 240000000L ; Max Performance (240MHz)

[env:ota_upload]
extends = env:production
upload_protocol = espota
upload_port = aquaponics-sensor.local  ; ใช้ mDNS Hostname แทน IP
upload_flags = 
	--auth=admin123       ; รหัสเดียวกับใน secrets.h
	--port=3232


