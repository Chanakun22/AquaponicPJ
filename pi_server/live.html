<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎥 กล้องสด - ระบบอควาโปนิกส์อัจฉริยะ</title>
    
    <!-- PWA -->
    <link rel="manifest" href="/pwa/manifest.json">
    <meta name="theme-color" content="#00f2aa">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/pwa/icon.svg">

    <link href="/static/fonts/fonts.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/fa/css/all.min.css">
    <link href="/base.css" rel="stylesheet">
    <script src="/header.js"></script>
    
    <style>
        /* === Page-specific overrides === */
        :root {
            --primary-color: #00f2aa;
            --secondary-color: #00c8ff;
            --bg-color: #0f1115;
            --card-bg: #1e293b;
            --text-color: #e2e8f0;
            --danger-color: #ff4d4d;
        }
        body { text-align: center; }
        .header {
            background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px);
            border-radius: 15px; margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .header-top { padding: 15px 20px; gap: 12px; }
        .brand h2 {
            margin: 0; font-weight: 600;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
        }
        .brand .subtitle { color: rgba(255,255,255,0.5); }

        /* Camera Container */
        .video-container {
            position: relative;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
            aspect-ratio: 16/9;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .video-stream {
            width: 100%;
            height: 100%;
            object-fit: contain;
            /* Rotate if needed */
            /* transform: rotate(180deg); */
        }
        
        .placeholder {
            position: absolute;
            color: #666;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            z-index: 0;
        }

        .video-stream {
            position: relative;
            z-index: 1;
        }

        /* Status Badge */
        .status-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.6);
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 2;
            backdrop-filter: blur(4px);
        }
        
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #ff4d4d; /* Red = Offline */
            box-shadow: 0 0 5px #ff4d4d;
        }
        
        .dot.online {
            background-color: #00f2aa;
            box-shadow: 0 0 8px #00f2aa;
            animation: pulse 2s infinite;
        }

        .dot.connecting {
            background-color: #f59e0b;
            box-shadow: 0 0 8px #f59e0b;
        }

        .dot.paused {
            background-color: #94a3b8;
            box-shadow: 0 0 6px #94a3b8;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 242, 170, 0.7); }
            70% { box-shadow: 0 0 0 6px rgba(0, 242, 170, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 242, 170, 0); }
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }

        .btn-control {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-color);
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }

        .btn-control:hover {
            border-color: var(--primary-color);
            background: rgba(0, 242, 170, 0.1);
        }

        .server-info {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #666;
        }

        /* === Responsive === */
        @media (max-width: 768px) {
            body { padding: 12px; }
            .header-top { padding: 10px 14px; }
            .header h2 { font-size: 1rem; }
            .btn-back { padding: 6px 10px; font-size: 0.8rem; }
            .controls { gap: 8px; flex-wrap: wrap; }
            .btn-control { padding: 10px 14px; font-size: 0.85rem; }
            .server-info { font-size: 0.7rem; word-break: break-all; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-top">
            <div class="brand">
                <i class="fas fa-video"></i>
                <div>
                    <h2>กล้องสด</h2>
                    <div class="subtitle">ภาพวิดีโอแบบเรียลไทม์</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Video Feed -->
    <div class="video-container">
        <div class="placeholder" id="placeholder">
            <i class="fas fa-video-slash fa-3x"></i>
            <span id="placeholderText">Connecting to camera...</span>
        </div>
        
        <div class="status-badge">
            <div class="dot" id="statusDot"></div>
            <span id="statusText">Offline</span>
        </div>

        <!-- The Image Stream -->
        <img id="camStream" class="video-stream" src="" alt="Live Stream" onerror="handleError()">
    </div>

    <div class="controls">
        <button class="btn-control" onclick="reloadStream()">
            <i class="fas fa-sync-alt"></i> Reload
        </button>
        <button class="btn-control" onclick="toggleMirror()">
            <i class="fas fa-exchange-alt"></i> Mirror
        </button>
    </div>

    <div class="server-info">
        Stream Source: <span id="streamUrl">Loading...</span>
    </div>

    <script>
        // Use the Flask proxy endpoint to allow Cloudflare Tunnel routing
        const streamUrl = `/cam-stream`;
        
        document.getElementById("streamUrl").innerText = window.location.host + streamUrl;
        
        const img = document.getElementById("camStream");
        const dot = document.getElementById("statusDot");
        const text = document.getElementById("statusText");
        const placeholder = document.getElementById("placeholder");
        const placeholderText = document.getElementById("placeholderText");
        let retryTimer = null;
        let intentionalStop = false;

        function setStatus(state, message = '') {
            dot.classList.remove("online", "connecting", "paused", "offline");

            if (state === "live") {
                dot.classList.add("online");
                text.textContent = "Live";
                text.style.color = "#00f2aa";
                placeholder.style.display = "none";
                return;
            }

            if (state === "connecting") {
                dot.classList.add("connecting");
                text.textContent = "Connecting";
                text.style.color = "#f59e0b";
                placeholder.style.display = "flex";
                placeholderText.textContent = message || "Connecting to camera...";
                return;
            }

            if (state === "paused") {
                dot.classList.add("paused");
                text.textContent = "Paused";
                text.style.color = "#94a3b8";
                placeholder.style.display = "flex";
                placeholderText.textContent = message || "Camera paused while this tab is hidden";
                return;
            }

            text.textContent = "Offline";
            text.style.color = "#ff4d4d";
            placeholder.style.display = "flex";
            placeholderText.textContent = message || "Camera stream is unavailable";
        }

        function stopStream(paused = false) {
            intentionalStop = true;
            if (retryTimer) {
                clearTimeout(retryTimer);
                retryTimer = null;
            }
            img.removeAttribute("src");
            img.style.display = "none";
            setStatus(paused ? "paused" : "offline");
        }

        function startStream() {
            if (document.hidden) {
                stopStream(true);
                return;
            }
            intentionalStop = false;
            if (retryTimer) clearTimeout(retryTimer);
            // Add timestamp to prevent browser caching
            setStatus("connecting");
            img.style.display = "none";
            img.src = streamUrl + "?t=" + Date.now();
        }

        function handleError() {
            if (intentionalStop) {
                return;
            }
            console.log("Stream Error/Offline - retrying in 5s...");
            img.style.display = "none";
            setStatus("offline", "Camera offline - retrying in 5s...");
            // Auto-retry (rpicam-vid restarts via loop in start_cam.sh)
            retryTimer = setTimeout(startStream, 5000);
        }

        function reloadStream() {
            startStream();
        }

        let isMirrored = false;
        function toggleMirror() {
            isMirrored = !isMirrored;
            img.style.transform = isMirrored ? "scaleX(-1)" : "none";
        }

        img.onload = function() {
            if (!intentionalStop) {
                img.style.display = "block";
                setStatus("live");
            }
        };

        document.addEventListener("visibilitychange", function() {
            if (document.hidden) {
                stopStream(true);
            } else {
                startStream();
            }
        });

        window.addEventListener("beforeunload", function() {
            stopStream(true);
        });

        // Auto start
        window.onload = startStream;
    </script>


</body>
</html>
