<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aquaponics - Settings</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --success-color: #10b981;
            --error-color: #ef4444;
            --warn-color: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 10px;
        }

        h1 {
            font-size: 1.6rem;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn {
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            text-decoration: none;
        }

        .btn:hover { background: rgba(255,255,255,0.2); }
        .btn-primary { background: var(--accent-color); color: #000; border: none; }
        .btn-primary:hover { background: #0ea5e9; }
        .btn-success { background: var(--success-color); color: #000; border: none; }
        .btn-success:hover { background: #059669; }

        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;
        }

        .card h2 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--accent-color);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: rgba(255,255,255,0.7);
            margin-bottom: 5px;
        }

        .form-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .form-row span {
            color: rgba(255,255,255,0.5);
        }

        input[type="number"], input[type="text"], input[type="time"], select {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 10px 12px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.95rem;
            width: 100%;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .form-row input {
            width: auto;
            flex: 1;
            min-width: 0;
        }

        /* Fix for invisible text in number inputs */
        .form-row input[type="number"] {
            color: #fff !important;
            background: rgba(0,0,0,0.5) !important;
            -webkit-text-fill-color: #fff;
        }
        
        .form-row input[type="number"]::placeholder {
            color: rgba(255,255,255,0.4);
            -webkit-text-fill-color: rgba(255,255,255,0.4);
        }

        .toggle-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toggle {
            position: relative;
            width: 50px;
            height: 26px;
        }

        .toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.2);
            border-radius: 26px;
            transition: 0.3s;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background: white;
            border-radius: 50%;
            transition: 0.3s;
        }

        .toggle input:checked + .toggle-slider {
            background: var(--success-color);
        }

        .toggle input:checked + .toggle-slider:before {
            transform: translateX(24px);
        }

        .footer-actions {
            margin-top: 25px;
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--success-color);
            color: white;
            padding: 15px 30px;
            border-radius: 10px;
            font-weight: 600;
            display: none;
            z-index: 1000;
        }

        .toast.error { background: var(--error-color); }
        .toast.show { display: block; animation: fadeIn 0.3s; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        .day-select { width: 100px; }
        .time-input { width: 100px; }
    </style>
</head>
<body>
    <header>
        <h1><i class="fas fa-cog"></i> Settings</h1>
        <a href="/" class="btn btn-primary"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
    </header>

    <div class="settings-grid">
        <!-- Thresholds -->
        <div class="card">
            <h2><i class="fas fa-thermometer-half"></i> Sensor Thresholds</h2>
            
            <div class="form-group">
                <label>pH Range</label>
                <div class="form-row">
                    <input type="number" id="ph_min" step="0.1" min="0" max="14">
                    <span>to</span>
                    <input type="number" id="ph_max" step="0.1" min="0" max="14">
                </div>
            </div>

            <div class="form-group">
                <label>Water Temperature (°C)</label>
                <div class="form-row">
                    <input type="number" id="water_temp_min" step="1">
                    <span>to</span>
                    <input type="number" id="water_temp_max" step="1">
                </div>
            </div>

            <div class="form-group">
                <label>Air Temperature (°C)</label>
                <div class="form-row">
                    <input type="number" id="air_temp_min" step="1">
                    <span>to</span>
                    <input type="number" id="air_temp_max" step="1">
                </div>
            </div>

            <div class="form-group">
                <label>Humidity (%)</label>
                <div class="form-row">
                    <input type="number" id="humidity_min" step="1">
                    <span>to</span>
                    <input type="number" id="humidity_max" step="1">
                </div>
            </div>

            <div class="form-group">
                <label>TDS (ppm)</label>
                <div class="form-row">
                    <input type="number" id="tds_min" step="10">
                    <span>to</span>
                    <input type="number" id="tds_max" step="10">
                </div>
            </div>
        </div>



        <!-- Sensor Management -->
        <div class="card">
            <h2><i class="fas fa-microchip"></i> Sensor Management</h2>
            <div class="form-group">
                <label>Active Sensors</label>
                
                <div class="toggle-container" style="justify-content: space-between; margin-bottom: 10px;">
                    <span>TDS Sensor</span>
                    <label class="toggle">
                        <input type="checkbox" id="sns_tds">
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                
                <div class="toggle-container" style="justify-content: space-between; margin-bottom: 10px;">
                    <span>pH Sensor</span>
                    <label class="toggle">
                        <input type="checkbox" id="sns_ph">
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                
                <div class="toggle-container" style="justify-content: space-between; margin-bottom: 10px;">
                    <span>Water Temp</span>
                    <label class="toggle">
                        <input type="checkbox" id="sns_water">
                        <span class="toggle-slider"></span>
                    </label>
                </div>

                <div class="toggle-container" style="justify-content: space-between; margin-bottom: 10px;">
                    <span>Air Temp & Humidity</span>
                    <label class="toggle">
                        <input type="checkbox" id="sns_air">
                        <span class="toggle-slider"></span>
                    </label>
                </div>

                <div class="toggle-container" style="justify-content: space-between; margin-bottom: 10px;">
                    <span>Light Sensor</span>
                    <label class="toggle">
                        <input type="checkbox" id="sns_light">
                        <span class="toggle-slider"></span>
                    </label>
                </div>
            </div>
        </div>

        <!-- Notifications -->
        <div class="card">
            <h2><i class="fas fa-bell"></i> Notifications</h2>

            <div class="form-group">
                <label>Enable Alerts</label>
                <div class="toggle-container">
                    <label class="toggle">
                        <input type="checkbox" id="notify_enabled">
                        <span class="toggle-slider"></span>
                    </label>
                    <span id="notify_status">OFF</span>
                </div>
            </div>

            <div class="form-group">
                <label>Channel Access Token</label>
                <input type="text" id="line_token" placeholder="Enter Channel Access Token (Long-lived)">
            </div>

            <div class="form-group">
                <label>Alert Cooldown (minutes)</label>
                <input type="number" id="alert_cooldown" min="1" max="60">
            </div>
        </div>

        <!-- Display -->
        <div class="card">
            <h2><i class="fas fa-desktop"></i> Display</h2>

            <div class="form-group">
                <label>Device Name</label>
                <input type="text" id="device_name" placeholder="My Aquaponics">
            </div>

            <div class="form-group">
                <label>Graph History (days)</label>
                <select id="graph_days">
                    <option value="1">1 Day</option>
                    <option value="3">3 Days</option>
                    <option value="7">7 Days</option>
                </select>
            </div>

            <div class="form-group">
                <label>Dashboard Refresh (seconds)</label>
                <select id="refresh_sec">
                    <option value="2">2 sec</option>
                    <option value="5">5 sec</option>
                    <option value="10">10 sec</option>
                </select>
            </div>
        </div>

            <!-- TDS Calibration -->
        <div class="card">
            <h2><i class="fas fa-flask"></i> TDS Calibration</h2>
            
            <div class="form-group">
                <label>Current TDS Voltage (Raw)</label>
                <div class="form-row">
                    <input type="text" id="current_voltage" readonly style="background:#000;color:#38bdf8;font-weight:bold;text-align:center;">
                    <button class="btn" onclick="refreshVoltage()"><i class="fas fa-sync-alt"></i></button>
                </div>
            </div>

            <div class="form-group">
                <label>Low Point (Standard Solution)</label>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:10px;">
                    <div>
                        <span style="font-size:0.8rem; color:rgba(255,255,255,0.5);">Temperature</span>
                        <input type="number" id="low_temp" value="25" step="0.1" style="width:100%; color:#fff; background:#000; padding:8px; border:1px solid #333; border-radius:6px;">
                    </div>
                    <div>
                        <span style="font-size:0.8rem; color:rgba(255,255,255,0.5);">PPM Value</span>
                        <input type="number" id="low_ppm" placeholder="500" step="1" style="width:100%; color:#fff; background:#000; padding:8px; border:1px solid #333; border-radius:6px;">
                    </div>
                </div>
                <div style="display:flex; gap:10px; align-items:center;">
                    <input type="text" id="low_voltage" placeholder="0.000 V" readonly style="flex:1; color:#38bdf8; background:#000; padding:8px; border:1px solid #333; border-radius:6px; text-align:center; font-weight:bold;">
                    <button class="btn btn-primary" onclick="readLowVoltage()"><i class="fas fa-download"></i> Read</button>
                </div>
            </div>

            <div class="form-group">
                <label>High Point (Standard Solution)</label>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:10px;">
                    <div>
                        <span style="font-size:0.8rem; color:rgba(255,255,255,0.5);">Temperature</span>
                        <input type="number" id="high_temp" value="25" step="0.1" style="width:100%; color:#fff; background:#000; padding:8px; border:1px solid #333; border-radius:6px;">
                    </div>
                    <div>
                        <span style="font-size:0.8rem; color:rgba(255,255,255,0.5);">PPM Value</span>
                        <input type="number" id="high_ppm" placeholder="1000" step="1" style="width:100%; color:#fff; background:#000; padding:8px; border:1px solid #333; border-radius:6px;">
                    </div>
                </div>
                <div style="display:flex; gap:10px; align-items:center;">
                    <input type="text" id="high_voltage" placeholder="0.000 V" readonly style="flex:1; color:#38bdf8; background:#000; padding:8px; border:1px solid #333; border-radius:6px; text-align:center; font-weight:bold;">
                    <button class="btn btn-primary" onclick="readHighVoltage()"><i class="fas fa-download"></i> Read</button>
                </div>
            </div>

            <div class="form-group" style="text-align:center;margin-top:15px;">
                <button class="btn btn-success" onclick="saveTdsCalibration()">
                    <i class="fas fa-check"></i> Save Calibration
                </button>
                <span id="cal_status" style="margin-left:15px;color:#888;"></span>
            </div>
        </div>
    </div>

    <div class="footer-actions">
        <button class="btn btn-success" onclick="saveSettings()">
            <i class="fas fa-save"></i> Save Settings
        </button>
        <button class="btn" onclick="loadSettings()">
            <i class="fas fa-undo"></i> Reset
        </button>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        let settings = {};

        async function loadSettings() {
            try {
                const res = await fetch('/api/settings');
                settings = await res.json();
                populateForm();
            } catch (e) {
                showToast('Failed to load settings', true);
            }
        }

        function populateForm() {
            // Thresholds
            document.getElementById('ph_min').value = settings.thresholds?.ph_min ?? 6.0;
            document.getElementById('ph_max').value = settings.thresholds?.ph_max ?? 7.5;
            document.getElementById('water_temp_min').value = settings.thresholds?.water_temp_min ?? 22;
            document.getElementById('water_temp_max').value = settings.thresholds?.water_temp_max ?? 30;
            document.getElementById('air_temp_min').value = settings.thresholds?.air_temp_min ?? 25;
            document.getElementById('air_temp_max').value = settings.thresholds?.air_temp_max ?? 35;
            document.getElementById('humidity_min').value = settings.thresholds?.humidity_min ?? 50;
            document.getElementById('humidity_max').value = settings.thresholds?.humidity_max ?? 80;
            document.getElementById('tds_min').value = settings.thresholds?.tds_min ?? 300;
            document.getElementById('tds_max').value = settings.thresholds?.tds_max ?? 600;



            // Sensor Config
            document.getElementById('sns_tds').checked = settings.sensor_config?.tds ?? true;
            document.getElementById('sns_ph').checked = settings.sensor_config?.ph ?? true;
            document.getElementById('sns_water').checked = settings.sensor_config?.water ?? true;
            document.getElementById('sns_air').checked = settings.sensor_config?.air ?? true;
            document.getElementById('sns_light').checked = settings.sensor_config?.light ?? true;

            // Notifications
            document.getElementById('notify_enabled').checked = settings.notifications?.enabled ?? false;
            document.getElementById('line_token').value = settings.notifications?.line_token ?? "";
            document.getElementById('alert_cooldown').value = settings.notifications?.alert_cooldown_min ?? 15;
            updateNotifyStatus();

            // Display
            document.getElementById('device_name').value = settings.display?.device_name ?? "Aquaponics System";
            document.getElementById('graph_days').value = settings.display?.graph_days ?? 3;
            document.getElementById('refresh_sec').value = settings.display?.refresh_sec ?? 5;
        }

        function collectForm() {
            return {
                thresholds: {
                    ph_min: parseFloat(document.getElementById('ph_min').value),
                    ph_max: parseFloat(document.getElementById('ph_max').value),
                    water_temp_min: parseInt(document.getElementById('water_temp_min').value),
                    water_temp_max: parseInt(document.getElementById('water_temp_max').value),
                    air_temp_min: parseInt(document.getElementById('air_temp_min').value),
                    air_temp_max: parseInt(document.getElementById('air_temp_max').value),
                    humidity_min: parseInt(document.getElementById('humidity_min').value),
                    humidity_max: parseInt(document.getElementById('humidity_max').value),
                    tds_min: parseInt(document.getElementById('tds_min').value),
                    tds_max: parseInt(document.getElementById('tds_max').value)
                },
                sensor_config: {
                    tds: document.getElementById('sns_tds').checked,
                    ph: document.getElementById('sns_ph').checked,
                    water: document.getElementById('sns_water').checked,
                    air: document.getElementById('sns_air').checked,
                    light: document.getElementById('sns_light').checked
                },
                light: settings.light || {},
                notifications: {
                    enabled: document.getElementById('notify_enabled').checked,
                    line_token: document.getElementById('line_token').value,
                    alert_cooldown_min: parseInt(document.getElementById('alert_cooldown').value)
                },
                display: {
                    device_name: document.getElementById('device_name').value,
                    graph_days: parseInt(document.getElementById('graph_days').value),
                    refresh_sec: parseInt(document.getElementById('refresh_sec').value)
                },
                tds_calibration: settings.tds_calibration || {}
            };
        }

        async function saveSettings() {
            const data = collectForm();
            try {
                const res = await fetch('/api/settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                if (result.status === 'ok') {
                    showToast('Settings saved! ✅');
                    settings = data;
                } else {
                    showToast('Error: ' + result.message, true);
                }
            } catch (e) {
                showToast('Failed to save settings', true);
            }
        }

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = isError ? 'toast error show' : 'toast show';
            setTimeout(() => toast.className = 'toast', 3000);
        }



        function updateNotifyStatus() {
            const enabled = document.getElementById('notify_enabled').checked;
            document.getElementById('notify_status').textContent = enabled ? 'ON' : 'OFF';
        }


        document.getElementById('notify_enabled').addEventListener('change', updateNotifyStatus);

        // === TDS Calibration Functions ===
        async function refreshVoltage() {
            try {
                const res = await fetch('/api/tds_voltage');
                const data = await res.json();
                document.getElementById('current_voltage').value = data.voltage.toFixed(3) + ' V';
            } catch (e) {
                document.getElementById('current_voltage').value = 'Error';
            }
        }

        function calculateCompensatedVoltage(rawV, tempElementId) {
            const temp = parseFloat(document.getElementById(tempElementId).value) || 25.0;
            // Formula: Vcomp = Vraw / (1 + 0.02 * (T - 25))
            const compV = rawV / (1.0 + 0.02 * (temp - 25.0));
            return compV;
        }

        function readLowVoltage() {
            refreshVoltage().then(() => {
                const currentV = parseFloat(document.getElementById('current_voltage').value);
                if (!isNaN(currentV)) {
                    const compV = calculateCompensatedVoltage(currentV, 'low_temp');
                    document.getElementById('low_voltage').value = compV.toFixed(3);
                    showToast(`Low point captured! (Compensated @ ${document.getElementById('low_temp').value}°C) ✅`);
                }
            });
        }

        function readHighVoltage() {
            refreshVoltage().then(() => {
                const currentV = parseFloat(document.getElementById('current_voltage').value);
                if (!isNaN(currentV)) {
                    const compV = calculateCompensatedVoltage(currentV, 'high_temp');
                    document.getElementById('high_voltage').value = compV.toFixed(3);
                    showToast(`High point captured! (Compensated @ ${document.getElementById('high_temp').value}°C) ✅`);
                }
            });
        }

        async function saveTdsCalibration() {
            const data = {
                low_temp: parseFloat(document.getElementById('low_temp').value) || 25,
                low_ppm: parseFloat(document.getElementById('low_ppm').value) || 0,
                low_voltage: parseFloat(document.getElementById('low_voltage').value) || 0,
                high_temp: parseFloat(document.getElementById('high_temp').value) || 25,
                high_ppm: parseFloat(document.getElementById('high_ppm').value) || 0,
                high_voltage: parseFloat(document.getElementById('high_voltage').value) || 0
            };

            if (data.low_voltage <= 0 || data.high_voltage <= 0) {
                showToast('Please read voltage for both points first!', true);
                return;
            }

            try {
                const res = await fetch('/api/tds_calibrate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                if (result.status === 'ok') {
                    showToast('TDS Calibration saved! ✅');
                    document.getElementById('cal_status').textContent = 'Calibrated ✅';
                    // Update global settings object to reflect new calibration
                    settings.tds_calibration = { ...settings.tds_calibration, ...data, calibrated: true };
                } else {
                    showToast('Error: ' + result.message, true);
                }
            } catch (e) {
                showToast('Failed to save calibration', true);
            }
        }

        function populateTdsCalibration() {
            const cal = settings.tds_calibration || {};
            document.getElementById('low_temp').value = cal.low_temp || 25;
            document.getElementById('low_ppm').value = cal.low_ppm || 500;
            document.getElementById('low_voltage').value = cal.low_voltage || '';
            document.getElementById('high_temp').value = cal.high_temp || 25;
            document.getElementById('high_ppm').value = cal.high_ppm || 1000;
            document.getElementById('high_voltage').value = cal.high_voltage || '';
            document.getElementById('cal_status').textContent = cal.calibrated ? 'Calibrated ✅' : 'Not Calibrated';
            refreshVoltage();
        }

        // Load on start
        window.onload = function() {
            loadSettings().then(() => {
                populateTdsCalibration();
            });
        };
    </script>
</body>
</html>
