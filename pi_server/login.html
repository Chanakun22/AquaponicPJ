<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 Login - Smart Aquaponics</title>
    <meta name="description" content="Login to Smart Aquaponics Dashboard">
    <link rel="manifest" href="/pwa/manifest.json">
    <meta name="theme-color" content="#00f2aa">
    <link href="/static/fonts/fonts.css" rel="stylesheet">
    <link href="/static/fa/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f1115;
            --bg-panel: #181b21;
            --primary: #00f2aa;
            --secondary: #00c8ff;
            --accent: #38bdf8;
            --danger: #ff2a6d;
            --success: #10b981;
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
            --glass-bg: rgba(24, 27, 33, 0.7);
            --glass-border: rgba(255, 255, 255, 0.08);
            --radius: 20px;
            --radius-sm: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: "Outfit", sans-serif;
            background-color: var(--bg-dark);
            background-image:
                radial-gradient(circle at 30% 20%, rgba(0, 242, 170, 0.06) 0%, transparent 50%),
                radial-gradient(circle at 70% 80%, rgba(0, 200, 255, 0.06) 0%, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-card {
            background: var(--bg-panel);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 40px 36px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 16px 64px rgba(0, 0, 0, 0.4);
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-icon {
            width: 72px; height: 72px;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 18px;
            background: linear-gradient(135deg, rgba(0, 242, 170, 0.1), rgba(0, 200, 255, 0.1));
            border: 1px solid rgba(0, 242, 170, 0.2);
            font-size: 1.8rem;
            color: var(--primary);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(0, 242, 170, 0.2); }
            50% { box-shadow: 0 0 0 12px rgba(0, 242, 170, 0); }
        }

        .login-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff 0%, var(--primary) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .login-header p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 8px;
            letter-spacing: 0.3px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper > i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        .input-wrapper .password-toggle {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 34px;
            height: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: none;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 10px;
            transition: color 0.3s ease, background 0.3s ease;
        }

        .input-wrapper .password-toggle:hover {
            color: var(--accent);
            background: rgba(56, 189, 248, 0.08);
        }

        .input-wrapper .password-toggle:focus-visible {
            outline: none;
            color: var(--accent);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.14);
        }

        .input-wrapper input {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 13px 14px 13px 42px;
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            outline: none;
        }

        .input-wrapper input.has-password-toggle {
            padding-right: 48px;
        }

        .input-wrapper input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.1);
            background: rgba(0, 0, 0, 0.6);
        }

        .input-wrapper input:focus + i,
        .input-wrapper input:focus ~ i {
            color: var(--accent);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #000;
            border: none;
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 242, 170, 0.25);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-msg {
            background: rgba(255, 42, 109, 0.1);
            border: 1px solid rgba(255, 42, 109, 0.3);
            color: var(--danger);
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 16px;
            display: none;
            align-items: center;
            gap: 8px;
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        .error-msg.show {
            display: flex;
        }

        .footer-text {
            text-align: center;
            margin-top: 24px;
            font-size: 0.78rem;
            color: var(--text-muted);
            opacity: 0.6;
        }

        .footer-text i {
            color: var(--primary);
        }

        @media (max-width: 480px) {
            .login-card { padding: 30px 24px; }
            .login-icon { width: 60px; height: 60px; font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-icon">
                    <i class="fas fa-leaf"></i>
                </div>
                <h1>Smart Aquaponics</h1>
                <p>Sign in to access the dashboard</p>
            </div>

            <div class="error-msg" id="errorMsg">
                <i class="fas fa-exclamation-circle"></i>
                <span id="errorText">Invalid credentials</span>
            </div>

            <form id="loginForm" onsubmit="doLogin(event)">
                <div class="form-group">
                    <label>Username</label>
                    <div class="input-wrapper">
                        <input type="text" id="username" placeholder="Enter username" autocomplete="username" required>
                        <i class="fas fa-user"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" class="has-password-toggle" placeholder="Enter password" autocomplete="current-password" required>
                        <i class="fas fa-lock"></i>
                        <button type="button" class="password-toggle" id="togglePasswordBtn" onclick="togglePassword()" aria-label="Show password" aria-pressed="false">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-login" id="btnLogin">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>
            </form>

            <div class="footer-text">
                <i class="fas fa-shield-alt"></i> Protected by Aquaponics Auth
            </div>
        </div>
    </div>

    <script>
    function togglePassword() {
        const input = document.getElementById('password');
        const button = document.getElementById('togglePasswordBtn');
        const icon = button.querySelector('i');
        const isHidden = input.type === 'password';

        input.type = isHidden ? 'text' : 'password';
        button.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
        button.setAttribute('aria-pressed', isHidden ? 'true' : 'false');
        icon.classList.toggle('fa-eye', !isHidden);
        icon.classList.toggle('fa-eye-slash', isHidden);
    }

    async function doLogin(e) {
        e.preventDefault();
        const btn = document.getElementById('btnLogin');
        const errDiv = document.getElementById('errorMsg');
        const errText = document.getElementById('errorText');

        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';
        errDiv.classList.remove('show');

        try {
            const resp = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: document.getElementById('username').value,
                    password: document.getElementById('password').value
                })
            });

            const data = await resp.json();

            if (data.status === 'ok') {
                btn.innerHTML = '<i class="fas fa-check"></i> Success!';
                btn.style.background = 'linear-gradient(135deg, #10b981, #059669)';
                setTimeout(() => {
                    window.location.href = data.redirect || '/';
                }, 500);
            } else {
                errText.textContent = data.message || 'Invalid username or password';
                errDiv.classList.add('show');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
            }
        } catch (err) {
            errText.textContent = 'Connection error. Please try again.';
            errDiv.classList.add('show');
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
        }
    }
    </script>
</body>
</html>
