<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📋 System Logs - Aquaponics</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0f1115;
            --bg-panel: #181b21;
            --primary: #00f2aa;
            --secondary: #00c8ff;
            --warning: #ffbf00;
            --danger: #ff2a6d;
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
            --glass-bg: rgba(24, 27, 33, 0.7);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-blur: 20px;
            --radius: 24px;
            --radius-sm: 12px;

            /* Log type colors */
            --info-color: #10b981;
            --warn-color: #f59e0b;
            --error-color: #ef4444;
            --debug-color: #a78bfa;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-dark);
            background-image:
                radial-gradient(circle at 10% 20%, rgba(0, 242, 170, 0.03) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 200, 255, 0.03) 0%, transparent 40%);
            color: var(--text-main);
            height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            height: 100%;
            gap: 16px;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            flex-shrink: 0;
        }

        .header-left { display: flex; align-items: center; gap: 12px; }
        .header-left h1 { font-size: 1.3rem; font-weight: 600; }
        .header-left h1 i { color: var(--primary); margin-right: 6px; }

        .header-right { display: flex; gap: 8px; flex-wrap: wrap; }

        .btn {
            padding: 8px 16px; border-radius: 8px; border: 1px solid var(--glass-border);
            background: rgba(255,255,255,0.06); color: var(--text-main); cursor: pointer;
            font-family: inherit; font-size: 0.85rem; display: inline-flex; align-items: center;
            gap: 6px; transition: all 0.2s; text-decoration: none;
        }
        .btn:hover { background: rgba(255,255,255,0.12); transform: translateY(-1px); }
        .btn-primary { background: var(--primary); color: #000; border: none; font-weight: 600; }
        .btn-primary:hover { background: #00d896; }
        .btn-danger { border-color: var(--danger); color: var(--danger); }
        .btn-danger:hover { background: rgba(255,42,109,0.15); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        /* ===== TOOLBAR ===== */
        .toolbar {
            display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
            padding: 14px 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            flex-shrink: 0;
        }

        .toolbar-group { display: flex; align-items: center; gap: 6px; }
        .toolbar-group label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

        .toolbar input, .toolbar select {
            padding: 7px 12px; border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(0,0,0,0.4); color: #fff;
            font-family: inherit; font-size: 0.85rem;
        }
        .toolbar input:focus, .toolbar select:focus { outline: none; border-color: var(--primary); }
        .toolbar input[type="text"] { width: 180px; }

        /* Date picker - bigger touch target + visible calendar icon */
        .toolbar input[type="date"] {
            min-width: 150px; padding: 8px 12px; cursor: pointer;
        }
        .toolbar input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1); cursor: pointer; font-size: 1.1rem;
        }
        .btn-clear {
            padding: 6px 10px; font-size: 0.8rem; border-radius: 6px;
            background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
            color: var(--text-muted); cursor: pointer; transition: all 0.2s;
        }
        .btn-clear:hover { background: rgba(255,42,109,0.15); color: var(--danger); }

        /* Type Pills */
        .pills { display: flex; gap: 4px; }
        .pill {
            padding: 5px 12px; border-radius: 20px; cursor: pointer;
            font-size: 0.78rem; font-weight: 500; user-select: none;
            transition: all 0.2s; border: 1px solid transparent;
            background: rgba(255,255,255,0.06);
        }
        .pill:hover { background: rgba(255,255,255,0.1); }
        .pill.active { font-weight: 700; }
        .pill[data-t="all"].active { background: var(--primary); color: #000; }
        .pill[data-t="info"].active { background: var(--info-color); color: #000; }
        .pill[data-t="warn"].active { background: var(--warn-color); color: #000; }
        .pill[data-t="error"].active { background: var(--error-color); color: #fff; }
        .pill[data-t="debug"].active { background: var(--debug-color); color: #000; }

        /* Stats */
        .stats {
            margin-left: auto; display: flex; gap: 14px;
            font-size: 0.82rem; color: var(--text-muted);
        }
        .stats span { display: flex; align-items: center; gap: 4px; }
        .stats .num { color: var(--text-main); font-weight: 600; }

        /* ===== LOG VIEWER ===== */
        .log-panel {
            flex: 1;
            background: var(--bg-panel);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .log-scroll {
            flex: 1;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.15) transparent;
        }
        .log-scroll::-webkit-scrollbar { width: 6px; }
        .log-scroll::-webkit-scrollbar-track { background: transparent; }
        .log-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }

        /* Log Lines */
        .log-line {
            display: grid;
            grid-template-columns: auto 60px 1fr;
            gap: 8px;
            padding: 7px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 0.82rem;
            line-height: 1.5;
            align-items: baseline;
        }
        .log-line:hover { background: rgba(255,255,255,0.03); }

        .l-time { color: rgba(255,255,255,0.35); font-size: 0.78rem; white-space: nowrap; }
        .l-tag {
            font-weight: 700; font-size: 0.72rem; text-align: center;
            padding: 1px 6px; border-radius: 4px; white-space: nowrap;
        }
        .l-msg { color: #cbd5e1; word-break: break-word; }

        /* Tag Colors */
        .tag-info  { color: var(--info-color);  background: rgba(16,185,129,0.12); }
        .tag-warn  { color: var(--warn-color);  background: rgba(245,158,11,0.12); }
        .tag-error { color: var(--error-color); background: rgba(239,68,68,0.15); }
        .tag-debug { color: var(--debug-color); background: rgba(167,139,250,0.12); }
        .tag-other { color: var(--text-muted);  background: rgba(255,255,255,0.06); }

        /* Error line highlight */
        .log-line.line-error { background: rgba(239,68,68,0.06); }
        .log-line.line-warn  { background: rgba(245,158,11,0.04); }

        /* States */
        .state-box {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; padding: 60px 20px; color: var(--text-muted);
            gap: 10px;
        }
        .state-box i { font-size: 2.5rem; opacity: 0.4; }
        .state-box p { font-size: 0.95rem; }

        /* Load More */
        .load-more {
            text-align: center; padding: 12px;
            border-top: 1px solid rgba(255,255,255,0.06);
            flex-shrink: 0;
        }
        .load-more button {
            background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
            color: var(--primary); padding: 8px 24px; border-radius: 8px;
            cursor: pointer; font-family: inherit; font-size: 0.85rem;
            transition: all 0.2s;
        }
        .load-more button:hover { background: rgba(0,242,170,0.1); }

        /* Auto-refresh indicator */
        .refresh-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--primary); display: inline-block;
            animation: blink 2s infinite;
        }
        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* Responsive */
        @media (max-width: 768px) {
            body { padding: 12px; }
            .header { padding: 12px 16px; flex-direction: column; gap: 10px; }
            .toolbar { flex-direction: column; align-items: stretch; }
            .toolbar input[type="text"] { width: 100%; }
            .stats { margin-left: 0; justify-content: center; }
            .log-line { grid-template-columns: 55px 50px 1fr; gap: 6px; padding: 6px 10px; font-size: 0.75rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <h1><i class="fas fa-scroll"></i> System Logs</h1>
            </div>
            <div class="header-right">
                <button onclick="fetchLogs()" class="btn" id="btnRefresh"><i class="fas fa-sync-alt"></i> Refresh</button>
                <button onclick="toggleAutoRefresh()" class="btn" id="btnAuto"><span class="refresh-dot"></span> Auto: ON</button>
                <button onclick="clearLogsFile()" class="btn btn-danger" id="btnDelete"><i class="fas fa-trash"></i> Delete All</button>
                <a href="/" class="btn btn-primary"><i class="fas fa-arrow-left"></i> Dashboard</a>
            </div>
        </div>

        <!-- Toolbar -->
        <div class="toolbar">
            <div class="toolbar-group">
                <label><i class="fas fa-calendar-alt" style="margin-right:4px;"></i> Date</label>
                <div style="display:flex;gap:4px;align-items:center;">
                    <input type="date" id="filterDate" title="Click to pick a date">
                    <button onclick="document.getElementById('filterDate').value='';applyFilters();" class="btn-clear" title="Show all dates">✕ All</button>
                </div>
            </div>

            <div class="toolbar-group">
                <label>Type</label>
                <div class="pills">
                    <span class="pill active" data-t="all" onclick="setType(this)">ALL</span>
                    <span class="pill" data-t="info" onclick="setType(this)">INFO</span>
                    <span class="pill" data-t="warn" onclick="setType(this)">WARN</span>
                    <span class="pill" data-t="error" onclick="setType(this)">ERROR</span>
                    <span class="pill" data-t="debug" onclick="setType(this)">DEBUG</span>
                </div>
            </div>

            <div class="toolbar-group">
                <label>Search</label>
                <input type="text" id="filterSearch" placeholder="Search logs..." oninput="applyFilters()">
            </div>

            <div class="stats">
                <span><i class="fas fa-database"></i> <span class="num" id="statTotal">0</span> total</span>
                <span><i class="fas fa-eye"></i> <span class="num" id="statShown">0</span> shown</span>
            </div>
        </div>

        <!-- Log Panel -->
        <div class="log-panel">
            <div class="log-scroll" id="logScroll">
                <div class="state-box" id="stateBox">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Loading logs...</p>
                </div>
            </div>
            <div class="load-more" id="loadMore" style="display:none;">
                <button onclick="showMore()">
                    <i class="fas fa-chevron-down"></i> Load More (<span id="remainCount">0</span> remaining)
                </button>
            </div>
        </div>
    </div>

    <script>
    // =============================================
    // STATE
    // =============================================
    var allLogs = [];          // All parsed log entries
    var filtered = [];         // After filters applied
    var typeFilter = 'all';
    var PAGE_SIZE = 300;       // Show 300 logs at a time
    var showCount = PAGE_SIZE; // How many to display
    var autoRefresh = true;
    var refreshTimer = null;
    var REFRESH_INTERVAL = 5000;

    // =============================================
    // FETCH & PARSE
    // =============================================
    async function fetchLogs() {
        var btn = document.getElementById('btnRefresh');
        btn.innerHTML = '<i class="fas fa-sync-alt fa-spin"></i> Loading...';
        btn.disabled = true;

        try {
            var resp = await fetch('/api/full_logs_file');
            if (!resp.ok) throw new Error('HTTP ' + resp.status);

            var text = await resp.text();
            if (!text || text.trim() === '') {
                allLogs = [];
                filtered = [];
                renderState('empty');
                updateStats();
                return;
            }

            allLogs = [];
            var lines = text.trim().split('\n');
            for (var i = 0; i < lines.length; i++) {
                var entry = parseLine(lines[i]);
                if (entry) allLogs.push(entry);
            }

            applyFilters();

        } catch (err) {
            renderState('error', err.message);
        } finally {
            btn.innerHTML = '<i class="fas fa-sync-alt"></i> Refresh';
            btn.disabled = false;
        }
    }

    function parseLine(line) {
        // Format: [2023-10-27 10:30:45] [INFO] Message...
        // or: [2023-10-27 10:30:45] ✅ ESP32 Reconnected!
        var m = line.match(/^\[(\d{4}-\d{2}-\d{2}) (\d{2}:\d{2}:\d{2})\]\s*(.*)$/);
        if (!m) return null;

        var msg = m[3];
        var type = 'other';
        if (msg.indexOf('[ERROR]') >= 0 || msg.indexOf('❌') >= 0) type = 'error';
        else if (msg.indexOf('[WARN]') >= 0 || msg.indexOf('⚠') >= 0) type = 'warn';
        else if (msg.indexOf('[INFO]') >= 0 || msg.indexOf('✅') >= 0 || msg.indexOf('📝') >= 0) type = 'info';
        else if (msg.indexOf('[DEBUG]') >= 0) type = 'debug';

        return { date: m[1], time: m[2], type: type, msg: msg };
    }

    // =============================================
    // FILTERS
    // =============================================
    function setType(el) {
        document.querySelectorAll('.pill').forEach(function(p) { p.classList.remove('active'); });
        el.classList.add('active');
        typeFilter = el.getAttribute('data-t');
        showCount = PAGE_SIZE;
        applyFilters();
    }

    function applyFilters() {
        var dateVal = document.getElementById('filterDate').value;
        var searchVal = document.getElementById('filterSearch').value.toLowerCase();

        filtered = allLogs;

        if (dateVal) {
            filtered = filtered.filter(function(l) { return l.date === dateVal; });
        }
        if (typeFilter !== 'all') {
            filtered = filtered.filter(function(l) { return l.type === typeFilter; });
        }
        if (searchVal) {
            filtered = filtered.filter(function(l) { return l.msg.toLowerCase().indexOf(searchVal) >= 0; });
        }

        renderLogs();
        updateStats();
    }

    // =============================================
    // RENDER
    // =============================================
    function renderLogs() {
        var scroll = document.getElementById('logScroll');
        var loadMore = document.getElementById('loadMore');

        if (filtered.length === 0) {
            renderState(allLogs.length === 0 ? 'empty' : 'no-match');
            loadMore.style.display = 'none';
            return;
        }

        // Save scroll position
        var wasAtTop = scroll.scrollTop < 50;
        var prevScroll = scroll.scrollTop;

        // Show newest first, limited by showCount
        var reversed = [];
        for (var i = filtered.length - 1; i >= 0; i--) {
            reversed.push(filtered[i]);
        }

        var toShow = reversed.slice(0, showCount);
        var remaining = reversed.length - toShow.length;

        // Show date+time when viewing all dates, time only when filtered
        var showDate = !document.getElementById('filterDate').value;

        var html = '';
        for (var j = 0; j < toShow.length; j++) {
            var log = toShow[j];
            var lineClass = '';
            if (log.type === 'error') lineClass = ' line-error';
            else if (log.type === 'warn') lineClass = ' line-warn';

            var timeDisplay = showDate ? (log.date.substring(5) + ' ' + log.time.substring(0,5)) : log.time;

            html += '<div class="log-line' + lineClass + '">' +
                '<span class="l-time">' + timeDisplay + '</span>' +
                '<span class="l-tag tag-' + log.type + '">' + log.type.toUpperCase() + '</span>' +
                '<span class="l-msg">' + escapeHtml(log.msg) + '</span>' +
                '</div>';
        }

        scroll.innerHTML = html;

        // Restore scroll position
        if (!wasAtTop) {
            scroll.scrollTop = prevScroll;
        }

        // Load more button
        if (remaining > 0) {
            loadMore.style.display = 'block';
            document.getElementById('remainCount').textContent = remaining;
        } else {
            loadMore.style.display = 'none';
        }
    }

    function renderState(type, details) {
        var scroll = document.getElementById('logScroll');
        var icon, text;

        if (type === 'empty') {
            icon = 'fas fa-inbox'; text = 'Log file is empty';
        } else if (type === 'no-match') {
            icon = 'fas fa-filter'; text = 'No logs match your filters';
        } else if (type === 'error') {
            icon = 'fas fa-exclamation-triangle'; text = 'Error: ' + (details || 'Unknown');
        }

        scroll.innerHTML = '<div class="state-box"><i class="' + icon + '"></i><p>' + text + '</p></div>';
    }

    function escapeHtml(s) {
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function updateStats() {
        document.getElementById('statTotal').textContent = allLogs.length;
        document.getElementById('statShown').textContent =
            Math.min(showCount, filtered.length) + '/' + filtered.length;
    }

    function showMore() {
        showCount += PAGE_SIZE;
        renderLogs();
        updateStats();
    }

    // =============================================
    // AUTO REFRESH
    // =============================================
    function toggleAutoRefresh() {
        autoRefresh = !autoRefresh;
        var btn = document.getElementById('btnAuto');
        if (autoRefresh) {
            btn.innerHTML = '<span class="refresh-dot"></span> Auto: ON';
            startAutoRefresh();
        } else {
            btn.innerHTML = '<i class="fas fa-pause"></i> Auto: OFF';
            stopAutoRefresh();
        }
    }

    function startAutoRefresh() {
        stopAutoRefresh();
        refreshTimer = setInterval(fetchLogs, REFRESH_INTERVAL);
    }

    function stopAutoRefresh() {
        if (refreshTimer) {
            clearInterval(refreshTimer);
            refreshTimer = null;
        }
    }

    // =============================================
    // DELETE LOGS
    // =============================================
    async function clearLogsFile() {
        if (!confirm('⚠️ Delete ALL logs? This cannot be undone.')) return;

        var btn = document.getElementById('btnDelete');
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Deleting...';
        btn.disabled = true;

        try {
            var res = await fetch('/api/clear_logs', { method: 'POST' });
            if (res.ok) {
                allLogs = [];
                filtered = [];
                renderState('empty');
                updateStats();
            } else {
                alert('Failed to clear logs (HTTP ' + res.status + ')');
            }
        } catch (e) {
            alert('Error: ' + e.message);
        } finally {
            btn.innerHTML = '<i class="fas fa-trash"></i> Delete All';
            btn.disabled = false;
        }
    }

    // =============================================
    // INIT
    // =============================================
    // No default date — show all logs on load
    // User can pick a date to filter, and press ✕ to clear

    document.getElementById('filterDate').addEventListener('change', function() {
        showCount = PAGE_SIZE;
        applyFilters();
    });

    fetchLogs();
    startAutoRefresh();
    </script>
</body>
</html>
