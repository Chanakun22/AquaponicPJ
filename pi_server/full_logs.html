<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aquaponics - Full System Logs</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --log-bg: #1e293b;
            --accent-color: #38bdf8;
            --error-color: #ef4444;
            --warn-color: #f59e0b;
            --success-color: #10b981;
            --debug-color: #a78bfa;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--accent-color);
        }

        .btn {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        .btn-primary {
            background: var(--accent-color);
            color: #000;
            border: none;
        }

        .btn-primary:hover {
            background: #0ea5e9;
        }

        /* ===== FILTER TOOLBAR ===== */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 15px;
            padding: 15px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            align-items: center;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .filter-group label {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.6);
            text-transform: uppercase;
        }

        .filter-group input, .filter-group select {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.3);
            color: white;
            font-family: inherit;
            font-size: 0.9rem;
        }

        .filter-group input:focus, .filter-group select:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        /* Type Filter Pills */
        .type-filters {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .type-pill {
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
            user-select: none;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .type-pill.active {
            font-weight: 600;
        }

        .pill-all { background: rgba(255,255,255,0.1); }
        .pill-all.active { background: var(--accent-color); color: #000; }

        .pill-info { background: rgba(16, 185, 129, 0.2); border-color: var(--success-color); }
        .pill-info.active { background: var(--success-color); color: #000; }

        .pill-warn { background: rgba(245, 158, 11, 0.2); border-color: var(--warn-color); }
        .pill-warn.active { background: var(--warn-color); color: #000; }

        .pill-error { background: rgba(239, 68, 68, 0.2); border-color: var(--error-color); }
        .pill-error.active { background: var(--error-color); color: #fff; }

        .pill-debug { background: rgba(167, 139, 250, 0.2); border-color: var(--debug-color); }
        .pill-debug.active { background: var(--debug-color); color: #000; }

        /* Stats */
        .stats {
            display: flex;
            gap: 15px;
            font-size: 0.85rem;
            color: rgba(255,255,255,0.7);
            margin-left: auto;
        }

        .stats span { display: flex; align-items: center; gap: 5px; }

        /* ===== LOG VIEWER ===== */
        #logViewer {
            flex: 1;
            background: var(--log-bg);
            border-radius: 12px;
            padding: 0;
            overflow-y: auto;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.85rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .log-line {
            padding: 6px 15px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            line-height: 1.4;
            display: flex;
            gap: 10px;
        }

        .log-line:hover {
            background: rgba(255,255,255,0.03);
        }

        .log-time {
            color: rgba(255,255,255,0.4);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .log-type {
            font-weight: 600;
            width: 55px;
            text-align: center;
            flex-shrink: 0;
        }

        .log-msg {
            color: #cbd5e1;
            word-break: break-word;
        }

        .type-info { color: var(--success-color); }
        .type-warn { color: var(--warn-color); }
        .type-error { color: var(--error-color); }
        .type-debug { color: var(--debug-color); }
        .type-other { color: rgba(255,255,255,0.5); }

        .loading, .empty-state {
            text-align: center;
            padding: 50px;
            color: rgba(255,255,255,0.5);
        }

        .empty-state i { font-size: 2rem; margin-bottom: 10px; display: block; }
    </style>
</head>
<body>
    <header>
        <h1><i class="fas fa-file-alt"></i> Full System Logs</h1>
        <div style="display: flex; gap: 10px;">
            <button onclick="fetchLogs()" class="btn"><i class="fas fa-sync-alt"></i> Refresh</button>
            <button onclick="clearLogsFile()" class="btn" style="border-color: var(--error-color); color: var(--error-color);"><i class="fas fa-trash"></i> DELETE</button>
            <a href="/" class="btn btn-primary"><i class="fas fa-arrow-left"></i> Back</a>
        </div>
    </header>

    <!-- Filter Toolbar -->
    <div class="filter-bar">
        <div class="filter-group">
            <label>Date</label>
            <input type="date" id="filterDate">
        </div>

        <div class="filter-group">
            <label>Log Type</label>
            <div class="type-filters">
                <span class="type-pill pill-all active" data-type="all" onclick="setTypeFilter(this)">ALL</span>
                <span class="type-pill pill-info" data-type="info" onclick="setTypeFilter(this)"><i class="fas fa-info-circle"></i> INFO</span>
                <span class="type-pill pill-warn" data-type="warn" onclick="setTypeFilter(this)"><i class="fas fa-exclamation-triangle"></i> WARN</span>
                <span class="type-pill pill-error" data-type="error" onclick="setTypeFilter(this)"><i class="fas fa-times-circle"></i> ERROR</span>
                <span class="type-pill pill-debug" data-type="debug" onclick="setTypeFilter(this)"><i class="fas fa-bug"></i> DEBUG</span>
            </div>
        </div>

        <div class="filter-group">
            <label>Search</label>
            <input type="text" id="filterSearch" placeholder="Search logs..." oninput="applyFilters()">
        </div>

        <div class="stats">
            <span><i class="fas fa-list"></i> <span id="statTotal">0</span> total</span>
            <span><i class="fas fa-filter"></i> <span id="statFiltered">0</span> shown</span>
        </div>
    </div>

    <div id="logViewer">
        <div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading logs...</div>
    </div>

    <script>
        let allLogs = []; // Raw logs array
        let currentTypeFilter = 'all';

        async function fetchLogs() {
            const viewer = document.getElementById('logViewer');
            // Only show loading if first load
            if (viewer.innerHTML.includes('Loading logs') && allLogs.length === 0) {
                 viewer.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading logs...</div>';
            }
            
            try {
                const response = await fetch('/api/full_logs_file');
                if (!response.ok) throw new Error('Failed to load logs');
                
                const text = await response.text();
                
                if (text.trim() === "") {
                    viewer.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i>Log file is empty.</div>';
                    allLogs = [];
                    updateStats();
                    return;
                }

                // Parse logs into structured data
                allLogs = text.trim().split('\n').map(line => parseLine(line)).filter(l => l);
                applyFilters();
                
            } catch (error) {
                viewer.innerHTML = `<div class="empty-state" style="color: var(--error-color);">
                    <i class="fas fa-exclamation-triangle"></i> Error loading logs: ${error.message}
                </div>`;
            }
        }

        function parseLine(line) {
            // Expected format: [2023-10-27 10:30:45] [INFO] Message here
            // or: [2023-10-27 10:30:45] ✅ ESP32 Reconnected!
            const match = line.match(/^\[(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})\]\s*(.*)$/);
            if (!match) return null;

            const timestamp = match[1];
            let rest = match[2];

            // Detect type
            let type = 'other';
            if (rest.includes('[ERROR]') || rest.includes('❌')) type = 'error';
            else if (rest.includes('[WARN]') || rest.includes('⚠️')) type = 'warn';
            else if (rest.includes('[INFO]') || rest.includes('✅') || rest.includes('📝')) type = 'info';
            else if (rest.includes('[DEBUG]')) type = 'debug';

            return { timestamp, type, message: rest, date: timestamp.split(' ')[0] };
        }

        function setTypeFilter(el) {
            document.querySelectorAll('.type-pill').forEach(p => p.classList.remove('active'));
            el.classList.add('active');
            currentTypeFilter = el.dataset.type;
            applyFilters();
        }

        function applyFilters() {
            const dateFilter = document.getElementById('filterDate').value;
            const searchFilter = document.getElementById('filterSearch').value.toLowerCase();

            let filtered = allLogs;

            // Filter by date
            if (dateFilter) {
                filtered = filtered.filter(log => log.date === dateFilter);
            }

            // Filter by type
            if (currentTypeFilter !== 'all') {
                filtered = filtered.filter(log => log.type === currentTypeFilter);
            }

            // Filter by search
            if (searchFilter) {
                filtered = filtered.filter(log => log.message.toLowerCase().includes(searchFilter));
            }

            renderLogs(filtered);
            updateStats(filtered.length);
        }

        function renderLogs(logs) {
            const viewer = document.getElementById('logViewer');

            if (logs.length === 0) {
                viewer.innerHTML = '<div class="empty-state"><i class="fas fa-filter"></i>No logs match your filters.</div>';
                return;
            }

            // Render as structured lines (newest first for readability)
            const html = [...logs].reverse().map(log => {
                const typeClass = 'type-' + log.type;
                const typeLabel = log.type.toUpperCase();
                const safeMsg = escapeHtml(log.message);

                return `<div class="log-line">
                    <span class="log-time">${log.timestamp.split(' ')[1]}</span>
                    <span class="log-type ${typeClass}">${typeLabel}</span>
                    <span class="log-msg">${safeMsg}</span>
                </div>`;
            }).join('');

            viewer.innerHTML = html;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function updateStats(filteredCount = 0) {
            document.getElementById('statTotal').textContent = allLogs.length;
            document.getElementById('statFiltered').textContent = filteredCount;
        }

        async function clearLogsFile() {
            if(!confirm("Are you sure you want to DELETE all logs? This cannot be undone.")) return;
             
            try {
                const res = await fetch('/api/clear_logs', { method: 'POST' });
                if(res.ok) {
                    fetchLogs(); // Reload
                } else {
                    alert("Failed to clear logs");
                }
            } catch(e) {
                alert("Error: " + e.message);
            }
        }

        // Event listeners
        document.getElementById('filterDate').addEventListener('change', applyFilters);

        // Load on start
        window.onload = fetchLogs;

        // Auto-refresh every 5 seconds
        setInterval(fetchLogs, 5000);
    </script>
</body>
</html>
