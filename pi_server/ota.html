<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📦 OTA Update - Smart Aquaponics</title>

    <!-- PWA -->
    <link rel="manifest" href="/pwa/manifest.json">
    <meta name="theme-color" content="#00f2aa">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/pwa/icon.svg">

    <link href="/static/fonts/fonts.css" rel="stylesheet">
    <link href="/static/fa/css/all.min.css" rel="stylesheet">
    <link href="/base.css" rel="stylesheet">
    <script src="/header.js"></script>
    <style>
        /* === Page-specific brand colors === */
        .brand i { color: var(--warning); filter: drop-shadow(0 0 8px rgba(255,191,0,0.4)); }
        .brand h1 {
            background: linear-gradient(135deg, #fff 0%, #fbbf24 100%);
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
        }
        .container { max-width: 700px; margin-top: 20px; }
        .card {
            background: var(--bg-panel);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 32px;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--warning), #f59e0b);
            opacity: 0.8;
        }

        .card h2 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card h2 i {
            font-size: 1rem;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: rgba(255, 191, 0, 0.1);
            color: var(--warning);
        }

        /* === Drop Zone === */
        .drop-zone {
            border: 2px dashed rgba(255,255,255,0.15);
            border-radius: 16px;
            padding: 48px 24px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .drop-zone:hover, .drop-zone.drag-over {
            border-color: var(--warning);
            background: rgba(255, 191, 0, 0.04);
        }

        .drop-zone.drag-over {
            transform: scale(1.01);
            box-shadow: 0 0 30px rgba(255, 191, 0, 0.1);
        }

        .drop-zone-icon {
            font-size: 3rem;
            color: var(--text-muted);
            margin-bottom: 16px;
            transition: all 0.3s ease;
        }

        .drop-zone:hover .drop-zone-icon {
            color: var(--warning);
            transform: translateY(-4px);
        }

        .drop-zone-text {
            font-size: 1rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .drop-zone-hint {
            font-size: 0.8rem;
            color: rgba(139, 155, 180, 0.6);
        }

        .drop-zone input[type="file"] {
            display: none;
        }

        /* === File Info === */
        .file-info {
            display: none;
            margin-top: 20px;
            padding: 16px 20px;
            background: rgba(0,0,0,0.3);
            border-radius: var(--radius-sm);
            border: 1px solid rgba(255,255,255,0.06);
        }

        .file-info.show { display: block; }

        .file-info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .file-info-row:last-child { margin-bottom: 0; }

        .file-name {
            font-weight: 600;
            color: var(--warning);
            font-size: 0.95rem;
        }

        .file-size {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .file-remove {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 0.85rem;
            padding: 4px 8px;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .file-remove:hover {
            background: rgba(255, 42, 109, 0.1);
        }

        /* === Progress === */
        .progress-container {
            display: none;
            margin-top: 20px;
        }

        .progress-container.show { display: block; }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.06);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--warning), #f59e0b);
            border-radius: 8px;
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-bar.success {
            background: linear-gradient(90deg, var(--success), #059669);
        }

        .progress-bar.error {
            background: linear-gradient(90deg, var(--danger), #dc2626);
        }

        .progress-text {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-align: center;
        }

        /* === Status Log === */
        .status-log {
            display: none;
            margin-top: 16px;
            padding: 16px;
            background: rgba(0,0,0,0.4);
            border-radius: var(--radius-sm);
            font-family: 'JetBrains Mono', 'Consolas', monospace;
            font-size: 0.78rem;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.04);
        }

        .status-log.show { display: block; }

        .log-line {
            padding: 3px 0;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .log-line.success { color: var(--success); }
        .log-line.error { color: var(--danger); }
        .log-line.info { color: var(--accent); }
        .log-line.warn { color: var(--warning); }

        /* === Upload Button === */
        .upload-btn {
            display: none;
            margin-top: 20px;
            width: 100%;
            padding: 14px 24px;
            background: linear-gradient(135deg, var(--warning), #f59e0b);
            color: #000;
            border: none;
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .upload-btn.show { display: flex; }

        .upload-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(255, 191, 0, 0.3);
        }

        .upload-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* === ESP32 Info === */
        .esp-info {
            margin-top: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .esp-info-item {
            padding: 12px 16px;
            background: rgba(0,0,0,0.2);
            border-radius: var(--radius-sm);
            border: 1px solid rgba(255,255,255,0.04);
        }

        .esp-info-label {
            font-size: 0.72rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .esp-info-value {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .esp-info-value.online { color: var(--success); }
        .esp-info-value.offline { color: var(--danger); }

        /* === Toast === */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            padding: 14px 28px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.9rem;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .toast.success {
            background: linear-gradient(135deg, var(--success), #059669);
            color: white;
        }

        .toast.error {
            background: linear-gradient(135deg, var(--danger), #dc2626);
            color: white;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }

        /* === Responsive === */
        @media (max-width: 768px) {
            body { padding: 12px; }
            .card { padding: 20px; }
            .drop-zone { padding: 32px 16px; }
            .drop-zone-icon { font-size: 2.5rem; }
            .esp-info { grid-template-columns: 1fr; }
        }

        /* Scrollbar */
        .status-log::-webkit-scrollbar { width: 4px; }
        .status-log::-webkit-scrollbar-track { background: transparent; }
        .status-log::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

        /* Pulse animation for uploading */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        .uploading .drop-zone-icon { animation: pulse 1.5s infinite; }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="header-top">
            <div class="brand">
                <i class="fas fa-microchip"></i>
                <div>
                    <h1>OTA Update</h1>
                    <div class="subtitle">Firmware Upload via Pi</div>
                </div>
            </div>
        </div>
    </header>

    <div class="container">
    <!-- Upload Card -->
    <div class="card">
        <h2><i class="fas fa-cloud-upload-alt"></i> Upload Firmware</h2>

        <!-- Drop Zone -->
        <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
            <div class="drop-zone-icon"><i class="fas fa-file-arrow-up"></i></div>
            <div class="drop-zone-text">ลากไฟล์ .bin มาวางตรงนี้</div>
            <div class="drop-zone-hint">หรือคลิกเพื่อเลือกไฟล์ • firmware.bin เท่านั้น</div>
            <input type="file" id="fileInput" accept=".bin">
        </div>

        <!-- File Info -->
        <div class="file-info" id="fileInfo">
            <div class="file-info-row">
                <div>
                    <div class="file-name" id="fileName">—</div>
                    <div class="file-size" id="fileSize">—</div>
                </div>
                <button class="file-remove" onclick="clearFile()"><i class="fas fa-times"></i> ลบ</button>
            </div>
        </div>

        <!-- Upload Button -->
        <button class="upload-btn" id="uploadBtn" onclick="startUpload()" disabled>
            <i class="fas fa-rocket"></i> Upload & Flash ESP32
        </button>

        <!-- Progress -->
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar-bg">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="progress-text" id="progressText">กำลังอัปโหลด...</div>
        </div>

        <!-- Status Log -->
        <div class="status-log" id="statusLog"></div>

        <!-- ESP32 Info -->
        <div class="esp-info">
            <div class="esp-info-item">
                <div class="esp-info-label">ESP32 Status</div>
                <div class="esp-info-value" id="espStatus">—</div>
            </div>
            <div class="esp-info-item">
                <div class="esp-info-label">ESP32 IP</div>
                <div class="esp-info-value" id="espIp">-</div>
            </div>
            <div class="esp-info-item">
                <div class="esp-info-label">Free Heap</div>
                <div class="esp-info-value" id="espHeap">—</div>
            </div>
            <div class="esp-info-item">
                <div class="esp-info-label">Uptime</div>
                <div class="esp-info-value" id="espUptime">—</div>
            </div>
        </div>
    </div>

    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // === State ===
        let selectedFile = null;
        let isUploading = false;

        // === Drop Zone ===
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('drag-over');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('drag-over');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-over');
            const file = e.dataTransfer.files[0];
            if (file) handleFile(file);
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) handleFile(file);
        });

        function handleFile(file) {
            if (!file.name.endsWith('.bin')) {
                showToast('❌ กรุณาเลือกไฟล์ .bin เท่านั้น', 'error');
                return;
            }

            selectedFile = file;
            document.getElementById('fileName').textContent = file.name;
            document.getElementById('fileSize').textContent = formatSize(file.size);
            document.getElementById('fileInfo').classList.add('show');
            document.getElementById('uploadBtn').disabled = false;
            document.getElementById('uploadBtn').classList.add('show');
        }

        function clearFile() {
            selectedFile = null;
            fileInput.value = '';
            document.getElementById('fileInfo').classList.remove('show');
            document.getElementById('uploadBtn').disabled = true;
            document.getElementById('uploadBtn').classList.remove('show');
            document.getElementById('progressContainer').classList.remove('show');
            document.getElementById('statusLog').classList.remove('show');
            document.getElementById('statusLog').innerHTML = '';
        }

        // === Upload ===
        async function startUpload() {
            if (!selectedFile || isUploading) return;

            isUploading = true;
            const btn = document.getElementById('uploadBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> กำลังอัปโหลด...';

            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');
            const statusLog = document.getElementById('statusLog');

            progressContainer.classList.add('show');
            statusLog.classList.add('show');
            statusLog.innerHTML = '';
            progressBar.style.width = '0%';
            progressBar.className = 'progress-bar';

            addLog('📦 เริ่ม Upload firmware...', 'info');
            addLog(`📄 ไฟล์: ${selectedFile.name} (${formatSize(selectedFile.size)})`, 'info');

            const formData = new FormData();
            formData.append('firmware', selectedFile);

            try {
                // Upload file to Pi
                const xhr = new XMLHttpRequest();

                xhr.upload.addEventListener('progress', (e) => {
                    if (e.lengthComputable) {
                        const pct = Math.round((e.loaded / e.total) * 50); // 50% for upload
                        progressBar.style.width = pct + '%';
                        progressText.textContent = `อัปโหลดไป Pi... ${pct * 2}%`;
                    }
                });

                xhr.addEventListener('load', () => {
                    if (xhr.status === 200) {
                        const result = JSON.parse(xhr.responseText);
                        if (result.status === 'uploading') {
                            addLog('✅ อัปโหลดไป Pi สำเร็จ', 'success');
                            addLog('🔄 กำลัง Flash ไป ESP32...', 'warn');
                            progressBar.style.width = '50%';
                            progressText.textContent = 'กำลัง Flash ไป ESP32...';
                            // Poll for status
                            pollOtaStatus(result.task_id);
                        } else {
                            handleError(result.message || 'Upload failed');
                        }
                    } else {
                        try {
                            const err = JSON.parse(xhr.responseText);
                            handleError(err.message || `HTTP ${xhr.status}`);
                        } catch {
                            handleError(`HTTP ${xhr.status}`);
                        }
                    }
                });

                xhr.addEventListener('error', () => {
                    handleError('เชื่อมต่อ Pi ไม่ได้');
                });

                xhr.open('POST', '/api/ota/upload');
                xhr.send(formData);

            } catch (err) {
                handleError(err.message);
            }
        }

        async function pollOtaStatus(taskId) {
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');

            let attempts = 0;
            const maxAttempts = 120; // 2 minutes max

            const poll = async () => {
                if (attempts >= maxAttempts) {
                    handleError('Timeout: Flash ใช้เวลานานเกินไป');
                    return;
                }

                try {
                    const res = await fetch(`/api/ota/status/${taskId}`);
                    const data = await res.json();

                    if (data.logs) {
                        // Show new logs
                        const statusLog = document.getElementById('statusLog');
                        statusLog.innerHTML = '';
                        data.logs.forEach(log => {
                            const cls = log.includes('✅') ? 'success' :
                                       log.includes('❌') ? 'error' :
                                       log.includes('⚠️') ? 'warn' : '';
                            addLog(log, cls);
                        });
                    }

                    if (data.status === 'success') {
                        progressBar.style.width = '100%';
                        progressBar.classList.add('success');
                        progressText.textContent = '✅ Flash สำเร็จ! ESP32 กำลัง reboot...';
                        addLog('🎉 OTA Update สำเร็จ!', 'success');
                        showToast('✅ Firmware อัปเดตสำเร็จ!', 'success');
                        resetUploadState();
                        return;
                    } else if (data.status === 'error') {
                        handleError(data.message || 'Flash failed');
                        return;
                    } else {
                        // Still in progress
                        const pct = 50 + Math.min(attempts * 2, 45);
                        progressBar.style.width = pct + '%';
                        attempts++;
                        setTimeout(poll, 1000);
                    }
                } catch (err) {
                    attempts++;
                    setTimeout(poll, 1000);
                }
            };

            poll();
        }

        function handleError(msg) {
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');

            progressBar.style.width = '100%';
            progressBar.classList.add('error');
            progressText.textContent = '❌ ' + msg;
            addLog('❌ ' + msg, 'error');
            showToast('❌ ' + msg, 'error');
            resetUploadState();
        }

        function resetUploadState() {
            isUploading = false;
            const btn = document.getElementById('uploadBtn');
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-rocket"></i> Upload & Flash ESP32';
        }

        // === Status Log ===
        function addLog(msg, cls = '') {
            const log = document.getElementById('statusLog');
            const line = document.createElement('div');
            line.className = 'log-line ' + cls;
            line.textContent = `[${new Date().toLocaleTimeString('th-TH')}] ${msg}`;
            log.appendChild(line);
            log.scrollTop = log.scrollHeight;
        }

        // === ESP32 Info ===
        async function updateEspInfo() {
            try {
                const res = await fetch('/api/health');
                const data = await res.json();

                const status = document.getElementById('espStatus');
                if (data.esp_status === 'ONLINE') {
                    status.textContent = '🟢 Online';
                    status.className = 'esp-info-value online';
                } else {
                    status.textContent = '🔴 Offline';
                    status.className = 'esp-info-value offline';
                }

                document.getElementById('espHeap').textContent =
                    data.free_heap ? formatSize(data.free_heap) : '—';

                document.getElementById('espUptime').textContent =
                    data.uptime_sec ? formatUptime(data.uptime_sec) : '—';

            } catch (err) {
                document.getElementById('espStatus').textContent = '⚠️ Pi ไม่ตอบ';
            }
        }

        async function loadSecureSettings() {
            try {
                const res = await fetch('/api/settings');
                const data = await res.json();
                const espIp = data?.secure?.esp_ip?.trim();
                if (espIp) {
                    document.getElementById('espIp').textContent = espIp;
                }
            } catch (err) {
                document.getElementById('espIp').textContent = '192.168.10.10';
            }
        }

        // === Helpers ===
        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1048576).toFixed(2) + ' MB';
        }

        function formatUptime(sec) {
            const h = Math.floor(sec / 3600);
            const m = Math.floor((sec % 3600) / 60);
            return `${h}h ${m}m`;
        }

        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = 'toast ' + type + ' show';
            setTimeout(() => toast.classList.remove('show'), 4000);
        }

        // === Init ===
        loadSecureSettings();
        updateEspInfo();
        setInterval(updateEspInfo, 10000);

        // Upload btn is hidden via CSS until file is selected
    </script>

</body>
</html>
